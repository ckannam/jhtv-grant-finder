name: AI Grant Deadline Updater (Quarterly)

on:
  schedule:
    - cron: '0 13 1 1,4,7,10 *'   # Jan / Apr / Jul / Oct 1st at 8 AM ET (13:00 UTC)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run AI grant deadline updater
        run: node ai_grant_updater.js

      - name: Commit and push updated grants_live.json
        run: |
          git config user.name  "Grant Bot"
          git config user.email "grantbot@users.noreply.github.com"
          git add grants_live.json
          git diff --staged --quiet || git commit -m "chore: AI grant deadline update $(date -u '+%Y-%m-%d')"
          git push
