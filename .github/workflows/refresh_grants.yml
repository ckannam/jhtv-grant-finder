name: Refresh Grant Live Data

on:
  # Run every Monday at 7am ET (12:00 UTC)
  schedule:
    - cron: '0 12 * * 1'
  # Also allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run grant data fetcher
        run: node fetch_grants.js

      - name: Commit updated grants_live.json
        run: |
          git config user.name  "Grant Bot"
          git config user.email "grantbot@users.noreply.github.com"
          git add grants_live.json
          # Only commit if something actually changed
          git diff --staged --quiet || git commit -m "chore: refresh grant live data $(date -u '+%Y-%m-%d')"

      - name: Push changes
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
