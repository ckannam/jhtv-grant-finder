name: Refresh Grant Live Data

on:
  # Run every Tuesday at 8am ET (12:00 UTC)
  schedule:
    - cron: '0 12 * * 2'
  # Also allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run grant data fetcher
        run: node fetch_grants.js

      - name: Commit and push updated grants_live.json
        run: |
          git config user.name  "Grant Bot"
          git config user.email "grantbot@users.noreply.github.com"
          git add grants_live.json
          git diff --staged --quiet || git commit -m "chore: refresh grant live data $(date -u '+%Y-%m-%d')"
          git push
