name: Scrape Grant Deadlines (Monthly)

on:
  schedule:
    - cron: '0 13 1 * *'
  workflow_dispatch:

# Serialize with the other grants_live.json workflows so concurrent pushes don't collide
concurrency:
  group: grants-data

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run grant website scraper
        run: node scrape_grants.js

      - name: Commit and push updated grants_live.json
        run: |
          git config user.name  "Grant Bot"
          git config user.email "grantbot@users.noreply.github.com"
          git add grants_live.json
          git diff --staged --quiet || git commit -m "chore: scrape grant deadlines $(date -u '+%Y-%m-%d')"
          git pull --rebase origin main
          git push
