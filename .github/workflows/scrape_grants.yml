name: Scrape Grant Deadlines (Monthly)

on:
  schedule:
    - cron: '0 13 1 * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run grant website scraper
        run: node scrape_grants.js

      - name: Commit and push updated grants_live.json
        run: |
          git config user.name  "Grant Bot"
          git config user.email "grantbot@users.noreply.github.com"
          git add grants_live.json
          git diff --staged --quiet || git commit -m "chore: scrape grant deadlines $(date -u '+%Y-%m-%d')"
          git push
